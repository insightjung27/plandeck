<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예약 신청 (SCR-BOOK-001)</title>
  <link rel="stylesheet" href="../../engine/common.css" />
  <link rel="stylesheet" href="../../engine/plandeck.css" />
</head>
<body>
  <div class="device-stage"><div class="device-mockup"><div class="device-frame"><div class="device-screen">
    <div class="pd-screen">
      <header class="pd-appbar">
        <button class="pd-back pd-ab-btn" aria-label="뒤로가기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="pd-ab-title">예약 신청</div>
        <span class="pd-ab-spacer"></span>
      </header>
      <div class="pd-app-body">
        <div class="pd-banner"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>햇살아이 발달센터 · 언어치료</div>
        <div class="pd-field">
          <span class="pd-field-label">아동 선택</span>
          <div class="pd-child pd-select"><span>단이 (만 4세 6개월)</span><svg class="pd-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round"/></svg></div>
        </div>
        <div class="pd-field">
          <span class="pd-field-label">서비스</span>
          <div class="pd-service pd-select"><span>언어치료 (40분)</span><svg class="pd-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round"/></svg></div>
        </div>
        <div class="pd-field">
          <span class="pd-field-label">희망 일정 <span style="color:#8B95A1;font-weight:500">(최대 3개)</span></span>
          <div class="pd-slots" style="display:flex;flex-direction:column;gap:8px">
            <div class="pd-input" style="justify-content:space-between"><span>10월 10일 (금) 오전 10:00</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F04452" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg></div>
            <div class="pd-input" style="justify-content:space-between"><span>10월 11일 (토) 오후 2:00</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F04452" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg></div>
            <button class="pd-btn secondary" style="height:46px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>일정 추가</button>
          </div>
        </div>
        <div class="pd-field">
          <span class="pd-field-label">요청사항 <span style="color:#8B95A1;font-weight:500">(선택)</span></span>
          <div class="pd-note pd-textarea">첫 방문이에요. 낯가림이 조금 있어요.</div>
        </div>
        <label class="pd-consent pd-check on">
          <span class="box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>아동 민감정보 제공에 동의합니다 <span style="color:#3182F6;font-weight:600">(필수)</span></span>
        </label>
      </div>
      <div class="pd-cta">
        <button class="pd-btn-next pd-btn primary block">다음</button>
      </div>
    </div>
  </div></div><div class="device-stand"></div><div class="device-base"></div></div></div>
  <script>window.PLANDECK_CURRENT='m-book.html';window.PDK_CURRENT=window.PLANDECK_CURRENT;</script>
  <script>
    (function(){var v=Date.now();var files=['config/devices.js','config/project.js','config/entities.js','config/prd.js','config/screens.js','../../engine/common.js','../../engine/plandeck.js'];
    for(var i=0;i<files.length;i++)document.write('<scr'+'ipt src="'+files[i]+'?_='+v+'"></scr'+'ipt>');})();
  </script>
</body>
</html>
