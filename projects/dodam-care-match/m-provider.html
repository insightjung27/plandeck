<body>
  <div class="device-stage"><div class="device-mockup"><div class="device-frame"><div class="device-screen">

        <div class="pd-ab-title">제공자 정보</div>
        <button class="pd-ab-btn" aria-label="공유"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke-linecap="round"/></svg></button>

          <div><div class="pd-wf-title">햇살아이 발달센터</div><div class="pd-row-sub" style="margin-top:3px">서울 강서구 · 언어치료, 놀이치료</div></div>

        </div>
        <div class="pd-chips">
          <span class="pd-chip is-brand">언어치료</span><span class="pd-chip is-brand">놀이치료</span><span class="pd-chip">만 3~7세</span><span class="pd-chip">주차 가능</span>
