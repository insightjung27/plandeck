<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이 (SCR-APP-004)</title>
  <link rel="stylesheet" href="../../engine/common.css" />
  <link rel="stylesheet" href="../../engine/plandeck.css" />
</head>
<body>
  <div class="device-stage"><div class="device-mockup"><div class="device-frame"><div class="device-screen">
    <div class="pd-screen">
      <div class="pd-safe-top"></div>
      <div style="padding:8px 18px 4px"><div class="pd-wf-title" style="font-size:20px">마이</div></div>
      <div class="pd-app-body">
        <div class="pd-section-title">로그인</div>
        <form class="pd-login" style="display:flex;flex-direction:column;gap:12px">
          <div class="pd-field"><label>아이디</label><input class="pd-input" placeholder="아이디" /></div>
          <div class="pd-field"><label>비밀번호</label><input class="pd-input" type="password" placeholder="비밀번호" /></div>
          <button class="pd-btn primary" style="width:100%;margin-top:2px">로그인</button>
          <button class="pd-signup pd-btn ghost" style="width:100%">회원가입 (가입 후 관리자 승인)</button>
        </form>

        <div class="pd-section-title" style="margin-top:8px">로그인하면 (프로필 예시)</div>
        <div class="pd-profile pd-list">
          <button class="pd-row">
            <div class="pd-avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div>
            <div class="pd-row-main"><div class="pd-row-title">김성도 집사</div><div class="pd-row-sub">청년부 · 활동 중</div></div>
            <svg class="pd-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg>
          </button>
          <button class="pd-row"><div class="pd-row-main"><div class="pd-row-title">내 정보 수정</div></div><svg class="pd-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg></button>
          <button class="pd-row"><div class="pd-row-main"><div class="pd-row-title">알림 설정</div></div><svg class="pd-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg></button>
        </div>
        <button class="pd-logout pd-btn secondary" style="width:100%;margin-top:12px">로그아웃</button>
      </div>
      <nav class="pd-tabbar">
        <button class="pd-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>홈</button>
        <button class="pd-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16l-7-3-7 3z" stroke-linecap="round" stroke-linejoin="round"/></svg>설교</button>
        <button class="pd-tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18" stroke-linecap="round"/></svg>헌금</button>
        <button class="pd-tab is-active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" stroke-linecap="round"/></svg>마이</button>
      </nav>
    </div>
  </div></div><div class="device-stand"></div><div class="device-base"></div></div></div>
  <script>window.PLANDECK_CURRENT='a-my.html';window.PDK_CURRENT=window.PLANDECK_CURRENT;</script>
  <script>
    (function(){var v=Date.now();var files=['config/devices.js','config/project.js','config/entities.js','config/prd.js','config/screens.js','../../engine/common.js','../../engine/plandeck.js'];
    for(var i=0;i<files.length;i++)document.write('<scr'+'ipt src="'+files[i]+'?_='+v+'"></scr'+'ipt>');})();
  </script>
</body>
</html>
